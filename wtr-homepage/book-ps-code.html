<style>
.wb-ps{max-width:760px;margin:6px auto 22px;padding:14px 20px;border:1px solid #e2dccd;border-radius:6px;background:#fffdf8;text-align:center;font-size:17px;line-height:1.5;color:#1f1f1f;}
.wb-ps p{margin:0 !important;}
.wb-ps b{font-weight:700;}
.wb-ps a.wb-link{color:#000fff;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;}
.wb-ps form{display:none;gap:10px;margin:14px auto 2px;max-width:640px;}
.wb-ps.wb-open form{display:flex;}
.wb-ps.wb-open .wb-link{color:#1f1f1f;text-decoration:none;cursor:default;}
.wb-ps input{flex:1 1 0;min-width:0;height:46px;padding:0 14px;border:1px solid #cfc7b4;border-radius:4px;background:#fff;font:inherit;font-size:16px;color:#111;}
.wb-ps input:focus{outline:none;border-color:#000fff;box-shadow:0 0 0 3px rgba(0,15,255,.12);}
.wb-ps button{flex:0 0 auto;height:46px;padding:0 20px;border:0;border-radius:4px;background:#111;color:#fff;font:inherit;font-size:15px;font-weight:700;letter-spacing:.02em;cursor:pointer;}
.wb-ps button:disabled{opacity:.6;cursor:wait;}
.wb-ps .wb-msg{margin-top:8px;font-size:14px;}
.wb-ps .wb-msg:empty{display:none;}
.wb-ps .wb-msg.err{color:#c0271e;}
.wb-ps .wb-ok{display:none;margin-top:10px;font-size:16px;color:#1f1f1f;}
.wb-ps.wb-done form,.wb-ps.wb-done .wb-msg{display:none !important;}
.wb-ps.wb-done .wb-ok{display:block;}
@media (max-width:640px){
  .wb-ps{font-size:15.5px;padding:12px 14px;margin:4px 0 16px;}
  .wb-ps.wb-open form{flex-direction:column;}
  .wb-ps button{width:100%;}
}
</style>
<div class="wb-ps" data-wb>
  <p><b>P.S.</b> The new book behind this framework drops in 2027. <a class="wb-link" href="https://www.wrecktheroom.com/book" data-wb-open>Get early access here.</a></p>
  <form novalidate>
    <input name="name" type="text" placeholder="First name" autocomplete="given-name" aria-label="First name">
    <input name="email" type="email" placeholder="Email" autocomplete="email" aria-label="Email">
    <button type="submit">Get early access</button>
  </form>
  <div class="wb-msg" role="status"></div>
  <p class="wb-ok"><b>You're on the list.</b> We'll email you early access and a free Chapter One the moment it's ready. Keep watching 👇</p>
</div><script>/* Book waitlist forms: post to Kajabi's "[Waitlist] Book Release - 1st Book" form in the background,
   so the visitor stays on the page (the training video keeps playing). */
(function(){
  var FORM = '/forms/2149477099/form_submissions';
  function token(){ var m=document.querySelector('meta[name="csrf-token"]'); return m?m.getAttribute('content'):''; }
  function bind(f){
    if(f.__wb)return; f.__wb=1;
    f.addEventListener('submit',function(e){
      e.preventDefault();
      var box=f.closest('[data-wb]'), msg=box.querySelector('.wb-msg'), btn=f.querySelector('button');
      var name=f.elements.name.value.trim(), email=f.elements.email.value.trim();
      if(!name||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ msg.textContent='Please add your name and a valid email.'; msg.className='wb-msg err'; return; }
      btn.disabled=true; btn.setAttribute('data-l',btn.textContent); btn.textContent='Saving your spot…'; msg.textContent=''; msg.className='wb-msg';
      var body=new URLSearchParams();
      body.append('authenticity_token',token()); body.append('website_url',''); body.append('kjb_fk_checksum','');
      try{ body.append('kjb_visitor_time_zone',Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC'); }catch(x){ body.append('kjb_visitor_time_zone','UTC'); }
      if(box.getAttribute('data-lp')) body.append('form_submission[landing_page_id]',box.getAttribute('data-lp'));
      body.append('thank_you_url','');
      body.append('form_submission[name]',name); body.append('form_submission[email]',email);
      fetch(FORM,{method:'POST',body:body,credentials:'same-origin',headers:{'Accept':'text/html'}})
        .then(function(r){
          // Kajabi redirects back with form_submission_error=1 (and a reason) when it rejects a sign-up.
          if(!r.ok) throw new Error('http');
          var m=/form_submission_error_reason=([^&]+)/.exec(r.url||'');
          if(/form_submission_error=1/.test(r.url||'')) throw new Error(m?decodeURIComponent(m[1]):'rejected');
          box.classList.add('wb-done');
        })
        .catch(function(err){
          btn.disabled=false; btn.textContent=btn.getAttribute('data-l');
          msg.innerHTML=err.message==='email'?'That email didn’t go through. Please use your main email address.'
            :'Something went wrong. Please try again, or <a href="https://www.wrecktheroom.com/book">join on the book page</a>.';
          msg.className='wb-msg err';
        });
    });
  }
  function init(){
    [].forEach.call(document.querySelectorAll('[data-wb] form'),bind);
    [].forEach.call(document.querySelectorAll('[data-wb-open]'),function(a){
      a.addEventListener('click',function(e){ e.preventDefault(); var b=a.closest('[data-wb]'); b.classList.add('wb-open'); var i=b.querySelector('input[name=name]'); if(i) setTimeout(function(){ i.focus({preventScroll:true}); },60); });
    });
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
