<style>
:root{--bg:#07050a;--bg2:#0e0a14;--card:#120c19;--line:#241a2e;--line2:#3a2e48;--ink:#fff;--mute:#a79fb3;--dim:#7d7389;--pink:#ff2e9a;--pink2:#ff5f8f;--cy:#22e1ff;--sun:#ff8a1f;--ok:#3ddc97;--bad:#ff5a5a;
  --grad:linear-gradient(95deg,#ff2e9a 0%,#ff5f8f 45%,#ff8a1f 100%);--pbh:0px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--mute);font:15px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:var(--pbh)}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;color:var(--ink);margin:0;line-height:.95;letter-spacing:.01em}
h1{font-size:clamp(40px,6vw,76px)}h2{font-size:30px}h3{font-size:22px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.top{position:sticky;top:0;z-index:50;background:rgba(7,5,10,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;height:66px}
.logo img{height:40px;display:block}.nav{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}
.nav a{font:800 11px/1 Inter;letter-spacing:.18em;text-transform:uppercase;color:#d6cee0;padding:10px 12px;border-radius:999px;white-space:nowrap}
.nav a.on,.nav a:hover{color:#fff;background:#1a1222}.nav a.on{box-shadow:inset 0 0 0 1px var(--line2)}
.me{font-size:12px;color:var(--dim);white-space:nowrap}.me b{color:#fff;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 20px;font:800 11px/1 Inter;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:transform .15s,box-shadow .2s,background .2s;white-space:nowrap}
.btn.p{background:var(--grad);color:#fff;box-shadow:0 0 26px rgba(255,46,154,.45)}.btn.p:hover{transform:translateY(-2px);box-shadow:0 0 44px rgba(255,46,154,.7)}
.btn.c{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px var(--cy)}.btn.c:hover{background:var(--cy);color:#07050a}
.btn.g{background:#1a1222;color:#e9e1f2;box-shadow:inset 0 0 0 1px var(--line2)}.btn.g:hover{background:#241a2e;color:#fff}
.btn.sm{padding:9px 14px;font-size:10px}.btn.x{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1px rgba(255,90,90,.4)}
.btn[disabled]{opacity:.45;pointer-events:none}
.eb{display:inline-block;font:800 11px/1 Inter;letter-spacing:.34em;text-transform:uppercase;color:var(--cy);margin-bottom:14px}
main{padding:40px 0 80px}
.in{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:13px 16px;color:#fff;outline:none;transition:border-color .2s,box-shadow .2s}
.in:focus{border-color:var(--cy);box-shadow:0 0 0 3px rgba(34,225,255,.18)}.in::placeholder{color:var(--dim)}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#a79fb3 50%),linear-gradient(135deg,#a79fb3 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
label.f{display:block;font:700 11px/1 Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:16px 0 8px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.card{background:linear-gradient(160deg,#150e1d,#0b0810);border:1px solid var(--line);border-radius:18px;padding:24px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{font:800 10px/1 Inter;letter-spacing:.14em;text-transform:uppercase;color:#d6cee0;background:transparent;border:1px solid var(--line2);border-radius:999px;padding:10px 14px;cursor:pointer}
.chip:hover{border-color:var(--pink);color:#fff}.chip.on{background:var(--grad);border-color:transparent;color:#fff}
#vocs .chip{border-color:var(--cy)}#vocs .chip.on{background:var(--cy);color:#07050a}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:22px;margin-top:28px}
.al{cursor:pointer}.al img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block;box-shadow:0 14px 30px rgba(0,0,0,.5);transition:transform .2s,box-shadow .2s;background:#111}
.al:hover img{transform:translateY(-4px);box-shadow:0 0 30px rgba(255,46,154,.45)}.al b{display:block;color:#fff;margin-top:10px;font-size:14px;line-height:1.3}.al span{font-size:12px;color:var(--dim)}
.list{margin-top:18px;border-top:1px solid var(--line)}
.tr{display:grid;grid-template-columns:38px 44px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:10px 6px;border-bottom:1px solid var(--line);border-radius:8px}
.tr:hover{background:#110b17}.tr.on{background:#1a0f1c}.tr.sub{padding-left:46px;grid-template-columns:38px minmax(0,1fr) auto auto}
.tp{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;padding:0}
.tp svg{width:14px;height:14px;fill:currentColor}.tr:hover .tp,.tr.on .tp{background:var(--grad);border-color:transparent}
.th{width:44px;height:44px;border-radius:6px;object-fit:cover;background:#111}
.tn{min-width:0}.tn b{display:block;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tr.on .tn b{color:var(--pink2)}
.tn small{display:block;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn .vx{background:none;border:0;color:var(--cy);font:700 10px Inter;letter-spacing:.12em;text-transform:uppercase;padding:2px 0;cursor:pointer}
.tm{font-size:12px;color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.ta{display:flex;gap:6px}.ib{height:32px;min-width:32px;padding:0 9px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:#d6cee0;font:800 10px Inter;letter-spacing:.08em;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.ib:hover{border-color:var(--cy);color:#fff}.ib svg{width:13px;height:13px;fill:currentColor}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}.tags span{font-size:10px;color:#cfc6da;border:1px solid rgba(255,255,255,.14);border-radius:99px;padding:2px 8px}
.ahead{display:grid;grid-template-columns:240px 1fr;gap:34px;align-items:end}.ahead img{width:100%;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.ahead p{max-width:640px}.k{font:800 11px Inter;letter-spacing:.26em;text-transform:uppercase;color:var(--cy)}
.toolbar{position:sticky;top:66px;z-index:20;background:var(--bg);padding:16px 0;display:flex;flex-direction:column;gap:12px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;margin-top:26px}
.pc{cursor:pointer;transition:border-color .2s,transform .2s}.pc:hover{border-color:var(--pink);transform:translateY(-3px)}.pc b{display:block;color:#fff;font-size:18px;margin-bottom:6px}
.mosaic{display:grid;grid-template-columns:1fr 1fr;width:64px;height:64px;border-radius:8px;overflow:hidden;flex:none;background:#1a1222}.mosaic img{width:100%;height:100%;object-fit:cover}
table{width:100%;border-collapse:collapse;font-size:13px}th{font:800 10px Inter;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);text-align:left;padding:10px 8px;border-bottom:1px solid var(--line2)}
td{padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:middle}td b{color:#fff;font-weight:600}.tw{overflow-x:auto}
.pill{display:inline-block;font:800 10px Inter;letter-spacing:.1em;text-transform:uppercase;border-radius:99px;padding:4px 9px;border:1px solid var(--line2);color:#d6cee0}
.pill.ok{color:var(--ok);border-color:rgba(61,220,151,.35)}.pill.w{color:var(--sun);border-color:rgba(255,138,31,.35)}.pill.b{color:var(--bad);border-color:rgba(255,90,90,.35)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:24px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}.kpi b{display:block;font:400 44px/1 Anton;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi span{font:700 11px Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
.feed div{padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}.feed div b{color:#fff;font-weight:600}.feed time{float:right;color:var(--dim);font-size:12px;margin-left:10px}
.chart{width:100%;height:180px;display:block}.legend{display:flex;gap:16px;font-size:12px;margin-top:8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.modal{position:fixed;inset:0;z-index:100;background:rgba(3,2,6,.78);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px}
.modal .card{width:100%;max-width:480px;max-height:86vh;overflow:auto;position:relative}.modal .x{position:absolute;right:14px;top:12px;background:none;border:0;color:#fff;font-size:26px;cursor:pointer}
.pick{display:block;width:100%;text-align:left;background:#150e1d;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;color:#fff}.pick:hover{border-color:var(--pink)}.pick small{color:var(--dim);margin-left:6px}
.copy{display:flex;gap:8px;margin-top:10px}.copy .in{font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(var(--pbh) + 22px);transform:translateX(-50%);z-index:200;background:#1a1222;border:1px solid var(--line2);color:#fff;padding:12px 20px;border-radius:999px;font-size:13px;box-shadow:0 10px 40px rgba(0,0,0,.6);animation:tIn .25s}
@keyframes tIn{from{opacity:0;transform:translate(-50%,10px)}}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 20px;background:radial-gradient(900px 500px at 10% 0%,rgba(255,46,154,.16),transparent 70%),radial-gradient(800px 500px at 100% 100%,rgba(34,225,255,.1),transparent 70%),var(--bg)}
.auth .card{width:100%;max-width:420px;padding:36px}.auth img{height:54px;margin-bottom:26px}.err{color:var(--bad);font-size:13px;margin-top:12px;min-height:18px}
.empty{padding:40px 0;color:var(--dim)}
.pbar{position:fixed;left:0;right:0;bottom:0;z-index:90;background:rgba(10,7,14,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line2);display:none}
.pbar .wrap{display:grid;grid-template-columns:minmax(0,260px) auto minmax(0,1fr);gap:20px;align-items:center;height:76px}
.pm{display:flex;gap:12px;align-items:center;min-width:0}.pm img{width:48px;height:48px;border-radius:6px;object-fit:cover}.pm div{min-width:0}.pm b{display:block;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}.pm span{display:block;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc2{display:flex;gap:8px;align-items:center}.pc2 button{background:none;border:0;color:#fff;cursor:pointer;width:36px;height:36px;display:flex;align-items:center;justify-content:center;padding:0}.pc2 svg{width:16px;height:16px;fill:currentColor}
.pc2 .pp{width:44px;height:44px;border-radius:50%;background:var(--grad);box-shadow:0 0 22px rgba(255,46,154,.5)}
.ps{display:flex;gap:12px;align-items:center;font-size:12px;font-variant-numeric:tabular-nums}.ps input{flex:1;accent-color:#ff2e9a}
.hero-s{padding:70px 0 30px;background:radial-gradient(900px 420px at 0% 0%,rgba(255,46,154,.16),transparent 70%)}
.note{font-size:13px;color:var(--dim);margin-top:14px}
@media(max-width:820px){.ahead{grid-template-columns:1fr}.ahead img{max-width:220px}.g2{grid-template-columns:1fr}.me{display:none}
  .tr{grid-template-columns:36px 40px minmax(0,1fr) auto}.tr .tm{display:none}.tr.sub{grid-template-columns:36px minmax(0,1fr) auto;padding-left:20px}
  .pbar .wrap{grid-template-columns:minmax(0,1fr) auto;height:auto;padding:10px 16px;gap:8px}.ps{grid-column:1/-1}.ib .lbl{display:none}}
@media(max-width:560px){.wrap{padding:0 16px}.top .wrap{gap:10px}.logo img{height:32px}.ta{flex-wrap:wrap;justify-content:flex-end;max-width:110px}}
</style>
</head>
<body>
<div id="app"></div>
<div class="pbar" id="pbar"><div class="wrap">
  <div class="pm"><img alt=""><div><b></b><span></span></div></div>
  <div class="pc2"><button data-p="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button data-p="play" class="pp" aria-label="Play/pause"></button>
    <button data-p="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    <button data-p="close" aria-label="Close player" style="font-size:22px">&times;</button></div>
  <div class="ps"><span class="pt">0:00</span><input type="range" min="0" max="1000" value="0" aria-label="Seek"><span class="pd">0:00</span></div>
</div></div>
<script>
(function(){
'use strict';
var IC={play:'<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>',pause:'<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M11 5h2v14h-2zM5 11h14v2H5z"/></svg>',dl:'<svg viewBox="0 0 24 24"><path d="M11 4h2v9l3.5-3.5 1.4 1.4L12 16.8 6.1 10.9l1.4-1.4L11 13zM5 18h14v2H5z"/></svg>',
  up:'<svg viewBox="0 0 24 24"><path d="M12 6l6 7H6z"/></svg>',down:'<svg viewBox="0 0 24 24"><path d="M12 18l-6-7h12z"/></svg>',x:'<svg viewBox="0 0 24 24"><path d="M6.4 5l12.6 12.6-1.4 1.4L5 6.4zM17.6 5L19 6.4 6.4 19 5 17.6z"/></svg>'};
var LV={none:0,mp3:1,wav:2},A=document.getElementById('app'),C=null,F={},ME=null,SHARE=null,PL=null;
var LOGO='__LOGO__';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(s,r){return (r||document).querySelector(s);}function $$(s,r){return [].slice.call((r||document).querySelectorAll(s));}
function fmt(s){s=Math.max(0,Math.round(s||0));return Math.floor(s/60)+':'+('0'+s%60).slice(-2);}
function ago(t){var d=Date.now()/1000-t;return d<90?'just now':d<3600?Math.round(d/60)+'m ago':d<86400?Math.round(d/3600)+'h ago':d<86400*30?Math.round(d/86400)+'d ago':new Date(t*1000).toLocaleDateString();}
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove();},2600);}
function api(p,o){o=o||{};return fetch(p,{method:o.method||(o.body?'POST':'GET'),headers:o.body?{'content-type':'application/json'}:{},body:o.body?JSON.stringify(o.body):undefined,credentials:'same-origin'})
  .then(function(r){return r.json().catch(function(){return{};}).then(function(d){if(!r.ok){var e=new Error(d.error||'Error '+r.status);e.status=r.status;throw e;}return d;});});}
function cover(a,big){return C.base+'covers/'+(big?'':'thumb/')+a.img+'.jpg';}
function lvl(){return SHARE?LV[SHARE.download]||0:ME?LV[ME.download]||0:0;}
function enc(s){return new TextEncoder().encode(s);}
function pwKey(email,pw){return crypto.subtle.importKey('raw',enc(pw),'PBKDF2',false,['deriveBits']).then(function(k){
  return crypto.subtle.deriveBits({name:'PBKDF2',salt:enc('ocho-portal:'+email.trim().toLowerCase()),iterations:200000,hash:'SHA-256'},k,256);})
  .then(function(b){return [].map.call(new Uint8Array(b),function(x){return('0'+x.toString(16)).slice(-2);}).join('');});}
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast('Link copied');},function(){prompt('Copy this link:',t);});}

/* ---------- catalog + search ---------- */
function loadCatalog(){return fetch('/catalog.json?v=__VER__').then(function(r){return r.json();}).then(function(c){C=c;
  c.albums.forEach(function(a){a.tracks.forEach(function(t,ti){t.al=a;t.i=ti;t.v.forEach(function(v,vi){v.key=v.f.replace(/\.mp3$/,'');F[v.key]={a:a,t:t,v:v,vi:vi};});
    t.hay={tg:norm(t.tags.join(' | ')),ti:norm(t.t),de:norm(t.desc+' '+a.t+' '+a.a+' '+a.c+' '+(a.desc||''))};});});});}
function norm(x){return ' '+String(x||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim()+' ';}
function hit(h,w){return h.indexOf(' '+w+(w.length<5?' ':''))>=0;}
function search(q,mood,voc){var G=[];voc=voc||'';
  if(mood)C.moods.forEach(function(m){if(m[0]===mood)G.push(m[3].split('|'));});
  norm(q).trim().split(' ').forEach(function(w){if(w.length<2||C.stop.indexOf(w)>=0)return;var g=[w];if(C.syn[w])g=g.concat(C.syn[w].split(' '));if(w.length>4&&/s$/.test(w))g.push(w.slice(0,-1));G.push(g);});
  if(!G.length&&!voc)return null;var out=[];
  C.albums.forEach(function(a){a.tracks.forEach(function(t){var ver=voc===''?t.v[0]:t.v.find(function(v){return v.voc===+voc;});if(!ver)return;var s=G.length?0:1,why=[];G.forEach(function(g){var b=0;g.forEach(function(w){
    if(hit(t.hay.tg,w)){b=Math.max(b,3);t.tags.forEach(function(x){if(hit(norm(x),w)&&why.indexOf(x)<0)why.push(x);});}else if(hit(t.hay.ti,w))b=Math.max(b,2);else if(hit(t.hay.de,w))b=Math.max(b,1);});s+=b;});
    if(s>0)out.push({t:t,s:s,why:why,key:ver.key});});});
  out.sort(function(x,y){return y.s-x.s;});return out.slice(0,80);}

/* ---------- track rows ---------- */
function dlBtns(key,shareTok){var L=lvl(),q=shareTok?'&s='+encodeURIComponent(shareTok):'',h='';
  if(L>=1)h+='<a class="ib" href="/dl?f='+encodeURIComponent(key)+'&fmt=mp3'+q+'" title="Download MP3" download>'+IC.dl+'<span class="lbl">MP3</span></a>';
  if(L>=2)h+='<a class="ib" href="/dl?f='+encodeURIComponent(key)+'&fmt=wav'+q+'" title="Download WAV" download>'+IC.dl+'<span class="lbl">WAV</span></a>';return h;}
function trow(key,o){o=o||{};var x=F[key];if(!x)return'';var t=x.t,v=x.v,a=x.a,sub=o.sub;
  var acts=(ME&&!SHARE?'<button class="ib" data-add="'+esc(key)+'" title="Add to playlist">'+IC.plus+'</button>':'')+dlBtns(key,SHARE&&SHARE.token)+(o.extra||'');
  return '<div class="tr'+(sub?' sub':'')+'" data-k="'+esc(key)+'" data-list="'+esc(o.list||'')+'"><button class="tp" aria-label="Play">'+IC.play+'</button>'+
    (sub?'':'<img class="th" src="'+esc(cover(a))+'" alt="" loading="lazy">')+
    '<div class="tn"><b>'+esc(sub?(v.l||'Main mix'):t.t+(v.l?' ('+v.l+')':''))+'</b>'+(sub?'':'<small>'+esc(a.t+' · '+a.a)+'</small>')+
    (o.why&&o.why.length?'<div class="tags">'+o.why.slice(0,3).map(function(w){return'<span>'+esc(w)+'</span>';}).join('')+'</div>':'')+

      return'<tr data-t="'+esc(s.token)+'"><td><b>'+esc(s.title)+'</b><br><span>'+esc(s.recipient||'No recipient noted')+' · '+(s.kind==='album'?'Album':'Playlist')+' · '+ago(s.created_at)+(s.expires_at?' · expires '+new Date(s.expires_at*1000).toLocaleDateString():'')+'</span></td>'+
        '<td><select class="in" data-dl style="padding:8px 30px 8px 10px">'+['none','mp3','wav'].map(function(o){return'<option value="'+o+'"'+(o===s.download?' selected':'')+'>'+{none:'Stream only',mp3:'MP3',wav:'MP3 + WAV'}[o]+'</option>';}).join('')+'</select></td>'+
        '<td>'+s.views+'</td><td>'+s.plays+'</td><td>'+s.downloads+'</td><td>'+(s.last_seen?ago(s.last_seen):'Not opened yet')+'</td>'+
        '<td style="white-space:nowrap">'+(dead?'<span class="pill b">'+(s.revoked?'Turned off':'Expired')+'</span> '+(s.revoked?'<button class="btn g sm" data-on>Turn on</button>':''):'<button class="btn c sm" data-copy="'+esc(u)+'">Copy link</button> <button class="btn x sm" data-off>Turn off</button>')+'</td></tr>';}).join('')+'</table></div>':
      '<p class="empty">No links yet. Open a playlist or album and choose <b>Share</b>.</p>'),'sh');
  var tb=$('table');if(!tb)return;
  tb.addEventListener('change',function(e){var s=e.target.closest('[data-dl]');if(s)api('/api/shares/'+s.closest('[data-t]').getAttribute('data-t'),{body:{download:s.value}}).then(function(){toast('Saved');});});
  tb.addEventListener('click',function(e){var t=e.target.closest('[data-t]');if(!t)return;var tok=t.getAttribute('data-t');
    if(e.target.closest('[data-off]')&&confirm('Turn off this link? The client will no longer be able to open it.'))api('/api/shares/'+tok,{body:{revoked:true}}).then(sharesPage);
    if(e.target.closest('[data-on]'))api('/api/shares/'+tok,{body:{revoked:false}}).then(sharesPage);});});}

var RANGE=30;
function title(f){var x=F[f];return x?x.t.t+(x.v.l?' ('+x.v.l+')':''):f&&f.indexOf('playlist:')===0?'a playlist':f&&F[f]===undefined&&C.albums.some(function(a){return a.id===f;})?C.albums.find(function(a){return a.id===f;}).t:f||'';}
function analyticsPage(){api('/api/stats?days='+RANGE).then(function(d){
  var T={};d.totals.forEach(function(r){T[r.kind]=r;});var n=function(k){return T[k]?T[k].n:0;};
  var days=[],m={};for(var i=d.days-1;i>=0;i--){var dt=new Date(Date.now()-i*864e5).toISOString().slice(0,10);days.push(dt);m[dt]={view:0,play:0,dl:0};}
  d.daily.forEach(function(r){if(!m[r.d])return;if(r.kind==='view')m[r.d].view+=r.n;else if(r.kind==='play')m[r.d].play+=r.n;else m[r.d].dl+=r.n;});
  var mx=1;days.forEach(function(x){mx=Math.max(mx,m[x].view+m[x].play+m[x].dl);});var W=1000,H=180,bw=W/days.length;
  var bars=days.map(function(x,i){var y=H,o='',seg=[['view','#22e1ff'],['play','#ff2e9a'],['dl','#ff8a1f']];seg.forEach(function(s){var h=m[x][s[0]]/mx*(H-10);if(h>0){y-=h;o+='<rect x="'+(i*bw+bw*.15)+'" y="'+y+'" width="'+bw*.7+'" height="'+h+'" fill="'+s[1]+'" rx="2"><title>'+x+': '+m[x][s[0]]+' '+s[0]+'</title></rect>';}});return o;}).join('');
  function who(e){return e.uname||e.uemail?'<b>'+esc(e.uname||e.uemail)+'</b>'+(e.ucompany?' ('+esc(e.ucompany)+')':''):e.stitle?'<b>'+esc(e.srecipient||'Someone')+'</b> via “'+esc(e.stitle)+'”':'Someone';}
  function what(e){return e.kind==='login'?'logged in':e.kind==='view'?'opened the link':e.kind==='play'?'played '+esc(title(e.file)):e.kind==='download'?'downloaded '+esc(title(e.file))+' ('+String(e.fmt).toUpperCase()+')':'downloaded a ZIP of '+e.n+' tracks ('+String(e.fmt).toUpperCase()+')';}
  function top(list){return list.length?list.map(function(r){var x=F[r.file];return'<div>'+(x?'<b>'+esc(x.t.t)+'</b>'+(x.v.l?' ('+esc(x.v.l)+')':'')+' · '+esc(x.a.t):esc(r.file))+'<time>'+r.n+'</time></div>';}).join(''):'<div class="note">Nothing yet.</div>';}
  render('<div class="row"><div class="sp"><span class="eb">Who is listening</span><h1>Analytics</h1></div><select class="in" id="rg" style="width:auto">'+[7,30,90,365].map(function(x){return'<option value="'+x+'"'+(x===RANGE?' selected':'')+'>Last '+x+' days</option>';}).join('')+'</select></div>'+
    '<div class="kpis"><div class="kpi"><b>'+n('view')+'</b><span>Link opens</span></div><div class="kpi"><b>'+n('play')+'</b><span>Plays</span></div><div class="kpi"><b>'+n('download')+'</b><span>File downloads</span></div><div class="kpi"><b>'+n('zip')+'</b><span>ZIP downloads</span></div><div class="kpi"><b>'+(T.login?T.login.who:0)+'</b><span>Users logged in</span></div></div>'+
    '<div class="card"><svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+bars+'</svg><div class="legend"><span><i style="background:#22e1ff"></i>Link opens</span><span><i style="background:#ff2e9a"></i>Plays</span><span><i style="background:#ff8a1f"></i>Downloads</span></div></div>'+
    '<div class="g2"><div class="card"><h3>Shared links</h3><div class="tw"><table><tr><th>Link</th><th>Opens</th><th>Plays</th><th>DLs</th><th>Last</th></tr>'+(d.shares.map(function(s){return'<tr><td><b>'+esc(s.recipient||s.title)+'</b><br><span>'+esc(s.title)+'</span></td><td>'+s.views+'</td><td>'+s.plays+'</td><td>'+s.downloads+'</td><td>'+ago(s.last_seen)+'</td></tr>';}).join('')||'<tr><td colspan="5" class="note">No link activity yet.</td></tr>')+'</table></div></div>'+
    '<div class="card"><h3>Clients</h3><div class="tw"><table><tr><th>Client</th><th>Plays</th><th>DLs</th><th>Last</th></tr>'+(d.users.map(function(u){return'<tr><td><b>'+esc(u.name||u.email)+'</b><br><span>'+esc(u.company||u.email)+'</span></td><td>'+u.plays+'</td><td>'+u.downloads+'</td><td>'+ago(u.last_seen)+'</td></tr>';}).join('')||'<tr><td colspan="4" class="note">No client activity yet.</td></tr>')+'</table></div></div>'+
    '<div class="card feed"><h3 style="margin-bottom:8px">Most played</h3>'+top(d.topPlays)+'</div><div class="card feed"><h3 style="margin-bottom:8px">Most downloaded</h3>'+top(d.topDownloads)+'</div></div>'+
    '<div class="card feed" style="margin-top:18px"><h3 style="margin-bottom:8px">Recent activity</h3>'+(d.feed.map(function(e){return'<div>'+who(e)+' '+what(e)+(e.country?' · '+esc(e.country):'')+'<time>'+ago(e.ts)+'</time></div>';}).join('')||'<div class="note">Nothing yet. Share a link to get started.</div>')+'</div>','an');
  $('#rg').onchange=function(){RANGE=+this.value;analyticsPage();};});}
function go404(){render('<h1>Not found</h1><p><a href="#/" style="color:var(--cy)">Back to the catalog</a></p>','');}

/* ---------- auth + public pages ---------- */
function authPage(inner){A.innerHTML='<div class="auth"><div class="card"><img src="'+LOGO+'" alt="Ocho Music Group">'+inner+'</div></div>';}
function loginPage(msg){authPage('<span class="eb">Client Portal</span><h2 style="margin-bottom:6px">Log in</h2><form id="lf"><label class="f">Email</label><input class="in" id="le" type="email" autocomplete="username" required>'+
  '<label class="f">Password</label><input class="in" id="lp" type="password" autocomplete="current-password" required><div class="err" id="lr">'+esc(msg||'')+'</div><button class="btn p" style="width:100%;margin-top:6px">Log in</button></form>'+
  '<p class="note">No account? Access is by invitation. Email <a href="mailto:music@ochomusicgroup.com" style="color:var(--cy)">music@ochomusicgroup.com</a>. Forgot your password? Ask us for a reset link.</p>');
  $('#lf').onsubmit=function(e){e.preventDefault();var b=$('button',this),em=$('#le').value;b.disabled=true;$('#lr').textContent='';
    pwKey(em,$('#lp').value).then(function(k){return api('/api/login',{body:{email:em,key:k}});}).then(function(){location.hash='#/';boot();}).catch(function(x){$('#lr').textContent=x.message;b.disabled=false;});};}
function invitePage(token){api('/api/invite/'+token).then(function(inv){var reset=inv.kind==='reset';
  authPage('<span class="eb">'+(reset?'Reset password':'Welcome to Ocho')+'</span><h2 style="margin-bottom:6px">'+(reset?'Choose a new password':'Set up your account')+'</h2><p class="note">'+esc(inv.email)+'</p><form id="if">'+
    (reset?'':'<label class="f">Your name</label><input class="in" id="iname" value="'+esc(inv.name||'')+'" required>')+
    '<label class="f">Password (at least 10 characters)</label><input class="in" id="ip" type="password" autocomplete="new-password" minlength="10" required>'+
    '<label class="f">Confirm password</label><input class="in" id="ip2" type="password" autocomplete="new-password" required><div class="err" id="ir"></div><button class="btn p" style="width:100%;margin-top:6px">'+(reset?'Save password':'Create account')+'</button></form>');
  $('#if').onsubmit=function(e){e.preventDefault();if($('#ip').value!==$('#ip2').value){$('#ir').textContent='Passwords do not match.';return;}var b=$('button',this);b.disabled=true;
    pwKey(inv.email,$('#ip').value).then(function(k){return api('/api/invite/accept',{body:{token:token,key:k,name:$('#iname')?$('#iname').value:''}});})
      .then(function(){history.replaceState(null,'','/#/');boot();}).catch(function(x){$('#ir').textContent=x.message;b.disabled=false;});};})
  .catch(function(x){authPage('<h2>Link not valid</h2><p class="note">'+esc(x.message)+'</p><a class="btn g" href="/">Go to login</a>');});}
function sharePage(token){api('/api/share/'+token+'?view=1').then(function(s){SHARE=s;s.token=token;var a=s.kind==='album'?C.albums.find(function(x){return x.id===s.ref;}):null;
  var files=a?a.tracks.map(function(t){return t.v[0].key;}):s.files;
  var lic='mailto:music@ochomusicgroup.com?subject='+encodeURIComponent('License request: '+s.title)+'&body='+encodeURIComponent('Hi Ocho,\n\nI would like to license the following from "'+s.title+'":\n\n- \n\nProject / network:\nMedia & territory:\nTerm:\n\nThanks!');
  A.innerHTML='<header class="top"><div class="wrap"><a class="logo" href="https://www.ochomusicgroup.com" target="_blank" rel="noopener"><img src="'+LOGO+'" alt="Ocho Music Group"></a><span class="sp"></span><a class="btn p sm" href="'+lic+'">License these tracks</a></div></header>'+
    '<section class="hero-s"><div class="wrap"><div class="row" style="align-items:flex-end;gap:26px">'+(a?'<img src="'+esc(cover(a,1))+'" alt="" style="width:200px;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.6)">':mosaic(files).replace('class="mosaic"','class="mosaic" style="width:150px;height:150px;border-radius:14px"'))+
    '<div class="sp"><span class="eb">'+(s.recipient?'Selected for '+esc(s.recipient):'Ocho Music Group')+'</span><h1>'+esc(s.title)+'</h1><p style="margin:10px 0 0">'+files.length+' tracks'+(a?' · '+esc(a.a):'')+' · Authentic Latin music for film, TV &amp; ads</p></div></div>'+
    '<div class="row" style="margin-top:24px"><button class="btn p" id="pa">'+IC.play+' Play all</button>'+zipBtns('s='+encodeURIComponent(token))+'</div></div></section>'+
    '<main style="padding-top:10px"><div class="wrap"><div class="list">'+files.map(function(k){return trow(k,{list:'sh',vers:!!a});}).join('')+'</div>'+
    '<div class="card" style="margin-top:34px"><h3>Want to use these?</h3><p style="margin:8px 0 16px">Tell us the project and we will send terms fast. Licensing in the US &amp; Canada runs through our partner APM Music, and we will connect you.</p><a class="btn p" href="'+lic+'">Request a license</a> <a class="btn g" href="https://www.ochomusicgroup.com/albums" target="_blank" rel="noopener">Explore the full catalog</a></div>'+
    '<p class="note" style="margin-top:30px">&copy; '+new Date().getFullYear()+' Ocho Music Group LLC. Previews and downloads are for evaluation only until licensed.</p></div></main>';
  $('#pa').onclick=function(){playList(files,0,token);};sync();})
  .catch(function(x){authPage('<h2>Link not available</h2><p class="note">'+esc(x.message)+'</p><a class="btn g" href="https://www.ochomusicgroup.com">Visit Ocho Music Group</a>');});}

function route(){if(!ME)return;$$('.modal').forEach(function(m){m.remove();});var h=location.hash.replace(/^#\/?/,'').split('/');
  if(h[0]==='album')albumPage(h[1]);else if(h[0]==='playlists')playlistsPage();else if(h[0]==='playlist')playlistPage(h[1]);
  else if(ME.role==='admin'&&h[0]==='users')usersPage();else if(ME.role==='admin'&&h[0]==='shares')sharesPage();else if(ME.role==='admin'&&h[0]==='analytics')analyticsPage();else catalogPage();}
function boot(){var p=location.pathname.split('/');
  if(p[1]==='s'&&p[2])return sharePage(p[2]);if((p[1]==='invite'||p[1]==='reset')&&p[2])return invitePage(p[2]);
  api('/api/me').then(function(m){ME=m;route();}).catch(function(){ME=null;loginPage();});}
window.addEventListener('hashchange',route);
loadCatalog().then(boot);
})();
</script>
</body>
</html>
